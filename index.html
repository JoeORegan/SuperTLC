<!doctype html>
<html lang="en-IE" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="author" content="Joe O'Regan" />
  <meta name="description" content="Superhero Game JavaScript" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Superhero Game</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <header class="topbar">
    <div class="container topbar-row">
      <nav class="topnav" aria-label="Main navigation">
        <a class="nav-link" href="https://joeoregan.github.io/">Home</a>
        <a class="nav-link active" href="./">Superhero Game</a>
      </nav>

      <div class="topbar-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark/light theme">
          Theme
        </button>
        <button id="audioToggleTop" class="theme-toggle" type="button" aria-label="Toggle music and sound">
          Audio: On
        </button>
        <button id="fsToggle" class="theme-toggle fs-toggle" type="button" aria-label="Toggle fullscreen">
          Fullscreen
        </button>
        <button id="resetBtn" class="theme-toggle reset-btn" type="button" aria-label="Restart game">
          Restart
        </button>
      </div>
    </div>
  </header>

  <main class="container page-content">
    <section class="page-panel">
      <h1>Superhero Game</h1>
      <p class="muted">Arcade shooter prototype</p>

      <div class="canvas-wrap" id="gameWrap">
        <canvas id="game" width="1136" height="640" tabindex="0" aria-label="Superhero Game canvas"></canvas>

        <div id="fsHud" class="fs-hud" aria-hidden="true">
          <button id="fsMenuBtn" class="fs-hud-btn" type="button" aria-label="Exit fullscreen and open menu">
            Menu
          </button>
          <button id="fsAudioBtn" class="fs-hud-btn" type="button" aria-label="Toggle music and sound">
            Audio: On
          </button>
          <button id="fsExitBtn" class="fs-hud-btn" type="button" aria-label="Exit fullscreen">
            Exit Fullscreen
          </button>
        </div>
      </div>
    </section>

    <section class="page-panel">
      <h2>Controls</h2>
      <ul>
        <li><b>Move:</b> <code>W</code>/<code>A</code>/<code>S</code>/<code>D</code> or arrows</li>
        <li><b>Fire:</b> <code>Space</code> or hold touch</li>
        <li><b>Audio:</b> <code>M</code> or <code>Audio</code> buttons</li>
        <li><b>Debug:</b> <code>P</code></li>
        <li><b>Fullscreen:</b> <code>Fullscreen</code> button, then use top-left <code>Menu</code> /
          <code>Exit Fullscreen</code></li>
        <li><b>Restart:</b> <code>R</code>/<code>Enter</code> or <code>Restart</code> button</li>
      </ul>
    </section>
  </main>

  <script>
    (function () {
      const root = document.documentElement;
      const themeBtn = document.getElementById("themeToggle");
      const audioTopBtn = document.getElementById("audioToggleTop");
      const fsBtn = document.getElementById("fsToggle");
      const resetBtn = document.getElementById("resetBtn");
      const gameWrap = document.getElementById("gameWrap");
      const fsHud = document.getElementById("fsHud");
      const fsMenuBtn = document.getElementById("fsMenuBtn");
      const fsAudioBtn = document.getElementById("fsAudioBtn");
      const fsExitBtn = document.getElementById("fsExitBtn");

      const savedTheme = localStorage.getItem("superhero-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        root.setAttribute("data-theme", savedTheme);
      }

      themeBtn?.addEventListener("click", function () {
        const current = root.getAttribute("data-theme") || "dark";
        const next = current === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("superhero-theme", next);
      });

      function isMobileLike() {
        return window.matchMedia("(max-width: 1024px)").matches || navigator.maxTouchPoints > 0;
      }

      function isFullscreenNow() {
        return !!document.fullscreenElement || !!document.webkitFullscreenElement || !!document.msFullscreenElement;
      }

      function setHudVisibility(show) {
        fsHud.style.display = show ? "flex" : "none";
        fsHud.setAttribute("aria-hidden", show ? "false" : "true");
      }

      function getAudioEnabled() {
        return !!window.__GAME_API__?.isAudioEnabled?.();
      }

      function setAudioButtonLabels() {
        const on = getAudioEnabled();
        const label = `Audio: ${on ? "On" : "Off"}`;
        audioTopBtn.textContent = label;
        fsAudioBtn.textContent = label;
      }

      function updateFsButton() {
        const inFs = isFullscreenNow();
        fsBtn.textContent = inFs ? "Exit Fullscreen" : "Fullscreen";
        fsBtn.style.display = "inline-block";
        setHudVisibility(inFs && isMobileLike());
      }

      async function requestFullscreenSafe(el) {
        if (el.requestFullscreen) return el.requestFullscreen();
        if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen();
        if (el.msRequestFullscreen) return el.msRequestFullscreen();
        throw new Error("Fullscreen API not supported");
      }

      async function exitFullscreenSafe() {
        if (document.exitFullscreen) return document.exitFullscreen();
        if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
        if (document.msExitFullscreen) return document.msExitFullscreen();
        throw new Error("Exit Fullscreen API not supported");
      }

      async function tryLockLandscape() {
        try {
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock("landscape");
          }
        } catch { }
      }

      async function tryUnlockOrientation() {
        try {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        } catch { }
      }

      async function enterFullscreen() {
        await requestFullscreenSafe(gameWrap);
        await tryLockLandscape();
      }

      async function exitFullscreen() {
        await exitFullscreenSafe();
        await tryUnlockOrientation();
      }

      async function toggleFullscreen() {
        if (!isFullscreenNow()) await enterFullscreen();
        else await exitFullscreen();
      }

      function toggleAudio() {
        if (window.__GAME_API__?.toggleAudio) {
          window.__GAME_API__.toggleAudio();
          setAudioButtonLabels();
        }
      }

      fsBtn?.addEventListener("click", async () => {
        try {
          await toggleFullscreen();
        } catch (err) {
          console.error("Fullscreen toggle failed:", err);
          alert("Fullscreen may be blocked on this browser/device. Try Chrome on Android.");
        } finally {
          updateFsButton();
        }
      });

      fsExitBtn?.addEventListener("click", async () => {
        try {
          if (isFullscreenNow()) await exitFullscreen();
        } catch (err) {
          console.error("Exit fullscreen failed:", err);
        } finally {
          updateFsButton();
        }
      });

      fsMenuBtn?.addEventListener("click", async () => {
        try {
          if (isFullscreenNow()) await exitFullscreen();
          window.scrollTo({ top: 0, behavior: "smooth" });
        } catch (err) {
          console.error("Menu action failed:", err);
        } finally {
          updateFsButton();
        }
      });

      audioTopBtn?.addEventListener("click", toggleAudio);
      fsAudioBtn?.addEventListener("click", toggleAudio);

      document.addEventListener("fullscreenchange", updateFsButton);
      document.addEventListener("webkitfullscreenchange", updateFsButton);
      document.addEventListener("MSFullscreenChange", updateFsButton);
      window.addEventListener("resize", updateFsButton);
      window.addEventListener("orientationchange", updateFsButton);

      updateFsButton();

      const t = setInterval(() => {
        if (window.__GAME_API__) {
          setAudioButtonLabels();
          clearInterval(t);
        }
      }, 100);

      if (resetBtn) resetBtn.style.display = "inline-block";
    })();
  </script>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
